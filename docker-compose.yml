# docker compose up -d --build      then open http://localhost:8000
# The image includes the YouTube PO token server, so this is the only service.
services:
  app:
    build: .
    ports:
      - "8000:7860"
    environment:
      # YT_PROXY: socks5://user:pass@residential-proxy:1080
      IG_COOKIES_FILE: /home/user/app/data/cookies.txt
    volumes:
      - ./data:/home/user/app/data   # put cookies.txt here
    restart: unless-stopped
