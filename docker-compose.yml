# Start everything with ONE command:   docker compose up
#
#  - app     the downloader, on http://localhost:8000 (this computer only)
#  - tunnel  a free Cloudflare quick tunnel that gives the app a public
#            https://<random-words>.trycloudflare.com link, printed in the
#            logs and shown on the page. No Cloudflare account needed.
#
# Optional settings go in a file named .env next to this one, for example:
#   ALLOWED_EMAILS=me@gmail.com      only these emails can open the public link
#   YT_PROXY=socks5://user:pass@host:1080
services:
  app:
    build: .
    pull_policy: build          # rebuild (fast, cached) on every `up`, so code updates apply
    ports:
      - "127.0.0.1:8000:7860"   # local only; other devices use the tunnel link
    environment:
      TUNNEL_METRICS_URL: http://tunnel:20241
      IG_COOKIES_FILE: /home/user/app/data/cookies.txt
      YT_PROXY: ${YT_PROXY:-}
    volumes:
      - ./data:/home/user/app/data   # put cookies.txt here (optional)
    restart: unless-stopped     # comes back after crashes and when Docker starts at boot

  tunnel:
    image: cloudflare/cloudflared:latest
    command: >-
      tunnel --no-autoupdate --metrics 0.0.0.0:20241 --url http://app:7860
      ${ALLOWED_EMAILS:+--allowed-mail=${ALLOWED_EMAILS}}
    depends_on:
      - app
    restart: unless-stopped
